{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur</title>
    <link rel="icon" href="{% static 'img/logo_mini.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="text-4xl text-red-500 mb-2">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Une erreur est survenue</h1>
            <p class="text-sm text-gray-600 mt-2">{{ message }}</p>
        </div>
        <div class="mt-4 text-center text-sm">
            <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:text-blue-500">Retour à la connexion</a>
        </div>
    </div>
</body>
</html>
