{% load static i18n %}
<!DOCTYPE html>
<!-- MODIFICATION : Langue et direction dynamiques -->
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Page introuvable" %} - THERANOTE</title>
    <link rel="icon" href="{% static 'img/logo_mini.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-center items-center">

    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-lg w-full mx-4">
        <div class="mb-6">
            <div class="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-compass text-4xl text-indigo-500"></i>
            </div>
            <h1 class="text-6xl font-extrabold text-indigo-600">404</h1>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">{% trans "Oups ! Page introuvable." %}</h2>
        <p class="text-gray-500 mb-8">
            {% trans "Il semble que le lien que vous avez suivi soit cassé ou que la page ait été déplacée." %}
        </p>

        <a href="/" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-150 ease-in-out shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
            <!-- MODIFICATION RTL : mr-2 devient me-2 -->
            <i class="fas fa-home me-2"></i>
            {% trans "Retour à l'accueil" %}
        </a>
    </div>

    <footer class="mt-8 text-gray-400 text-sm">
        &copy; 2025 <span dir="ltr">THERANOTE</span>
    </footer>

</body>
</html>
