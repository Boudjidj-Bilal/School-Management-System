{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="icon" href="{% static 'img/logo_mini.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="flex flex-col items-center mb-6">
            <div>
                <img src="{% static 'img/logo-transparent-svg.svg' %}" 
                     alt="Logo de l'école" 
                     class="h-24 w-auto object-contain">
            </div>
            <h3 class="text-3xl font-bold text-gray-800 text-center">Connexion</h3>
        </div>

        <form id="loginForm" class="space-y-6" 
              data-login-url="{% url 'login' %}" 
              data-success-url="{% url 'dashboard' %}">
              
            {% csrf_token %}
            <!-- Les inputs cachés de géolocalisation ont été supprimés ici -->
            
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nom d'utilisateur</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" name="username" required 
                           class="mt-1 block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg shadow-sm 
                                  focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent 
                                  transition duration-300"
                           placeholder="Entrez votre nom d'utilisateur">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" name="password" required 
                           class="mt-1 block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg shadow-sm 
                                  focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent 
                                  transition duration-300"
                           placeholder="Entrez votre mot de passe">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div id="messageBox" class="text-sm font-medium"></div>
                <div id="loadingIndicator" class="hidden text-blue-500 font-semibold text-sm">Chargement...</div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 
                           hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 
                           transition duration-300 transform hover:scale-105">
                Se connecter
            </button>
        </form>
        <div class="mt-4 text-center text-sm">
            <a href="{% url 'password_reset' %}" class="font-medium text-blue-600 hover:text-blue-500">Mot de passe oublié ?</a>
        </div>
    </div>

    <script src="{% static 'js/users/login_page.js' %}"></script>
</body>
</html>
