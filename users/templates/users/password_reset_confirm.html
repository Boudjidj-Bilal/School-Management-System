{% load static i18n %}
<!DOCTYPE html>
<!-- MODIFICATION : Langue et direction dynamiques -->
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Nouveau mot de passe" %}</title>
    <link rel="icon" href="{% static 'img/logo_mini.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="flex flex-col items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800 text-center">{% trans "Nouveau mot de passe" %}</h1>
            <p class="text-sm text-gray-600 mt-2 text-center">{% trans "Entrez votre nouveau mot de passe pour le mettre à jour." %}</p>
        </div>

        <form id="passwordConfirmForm" class="space-y-6" 
              data-confirm-url="{{ request.path }}"
              data-success-url="{% url 'login' %}"
              data-msg-error-default="{% trans 'Erreur lors de la mise à jour du mot de passe.' %}"
              data-msg-error-tech="{% trans 'Une erreur de connexion est survenue. Veuillez réessayer.' %}">
            
            {% csrf_token %}
            
            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-700 mb-1">{% trans "Nouveau mot de passe" %}</label>
                
                <!-- Le conteneur parent devient Flex et gère le design global (bordures, focus) -->
                <div class="mt-1 flex items-center gap-2 px-3 bg-white border border-gray-300 rounded-lg shadow-sm focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-transparent transition duration-300">
                    
                    <!-- L'icône est un élément flex naturel -->
                    <div class="flex items-center pointer-events-none flex-shrink-0">
                        <i class="fas fa-lock text-gray-400"></i>
                    </div>
                    
                    <!-- L'input prend tout l'espace (flex-1) sans ses propres bordures. Ajout de dir="ltr" pour les mots de passe -->
                    <input type="password" id="new_password" name="new_password" required 
                           class="flex-1 block w-full py-2 px-0 border-none bg-transparent focus:ring-0 sm:text-sm"
                           placeholder="{% trans 'Entrez votre nouveau mot de passe' %}" dir="ltr">
                </div>
            </div>

            <div class="flex items-center justify-between">
                <div id="messageBox" class="text-sm font-medium"></div>
                <div id="loadingIndicator" class="hidden text-blue-500 font-semibold text-sm">{% trans "Chargement..." %}</div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full flex items-center justify-center gap-2 py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300 transform hover:scale-105">
                <span>{% trans "Mettre à jour" %}</span>
            </button>
        </form>
        
        <div class="mt-4 text-center text-sm">
            <a href="{% url 'login' %}" class="font-medium text-blue-600 hover:text-blue-500">{% trans "Retour à la connexion" %}</a>
        </div>
    </div>

    <script src="{% static 'js/users/password_reset_confirm.js' %}"></script>
</body>
</html>
